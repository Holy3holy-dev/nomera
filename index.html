<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Номеров</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1a1a1a; color: #ddd; text-align: center; margin: 0; padding: 10px; user-select: none; }
        
        /* Модальные окна */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #2a2a2a; padding: 20px; border-radius: 12px; width: 80%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-box input[type="text"], .modal-box select { padding: 12px; font-size: 16px; border-radius: 6px; border: none; margin-bottom: 20px; width: 90%; background: #444; color: white; outline: none; }
        .modal-box input[type="range"] { width: 100%; margin: 15px 0; }
        
        /* Шапка */
        .header { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 20px; background: #252525; padding: 15px; border-radius: 8px; align-items: center; }
        .header-name { color: #66bb6a; font-weight: bold; }
        .menu-btn { font-size: 24px; cursor: pointer; padding: 0 10px; color: #888; }
        
        /* Номер */
        .plate-container { background: white; color: black; border: 3px solid #222; border-radius: 6px; padding: 10px 15px; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; margin: 30px auto; width: fit-content; font-family: 'Arial Black', sans-serif; box-shadow: 0 6px 15px rgba(0,0,0,0.7); }
        .plate-main { display: flex; align-items: center; padding-right: 15px; border-right: 2px solid black; }
        .plate-region { display: flex; flex-direction: column; align-items: center; padding-left: 15px; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .plate-region:active { opacity: 0.5; }
        .plate-region-text { font-size: 12px; display: flex; align-items: center; margin-top: 2px; }
        .flag { width: 18px; height: 12px; background: linear-gradient(to bottom, white 33%, blue 33%, blue 66%, red 66%); margin-left: 5px; border: 1px solid #999; }
        
        /* Кнопки (успокоенный дизайн) */
        .btn-container { margin: 20px 0; display: flex; flex-direction: column; gap: 15px; }
        .btn { background: #444; color: #eee; border: none; padding: 14px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; width: 100%; box-shadow: 0 3px 0 #222; transition: 0.1s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
        .btn-letters { background: #3a4a5a; box-shadow: 0 3px 0 #1a2a3a; }
        .btn-save { background: #5a4a3a; box-shadow: 0 3px 0 #3a2a1a; margin-top: 10px; }
        .btn-green { background: #3a5a3a; box-shadow: 0 3px 0 #1a3a1a; margin-top: 10px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; transform: none; }
        
        /* Табы и списки */
        .inventory, .garage { background: #222; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; }
        .item { background: #333; padding: 12px; margin: 10px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .item button { background: #6a3a3a; color: white; border: none; padding: 8px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .item button.buy { background: #3a5a3a; }
        
        .nav-tabs { display: flex; justify-content: space-around; background: #252525; border-radius: 8px; padding: 5px; }
        .nav-tab { padding: 12px; cursor: pointer; font-size: 14px; border-radius: 6px; flex-grow: 1; transition: 0.3s; color: #999; }
        .nav-tab.active { background: #444; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Окно регистрации -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0; color: #66bb6a;">Добро пожаловать</h3>
            <input type="text" id="nickname-input" placeholder="Ваш никнейм" maxlength="15">
            <button class="btn btn-green" onclick="registerUser()">Начать</button>
        </div>
    </div>

    <!-- Настройки -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 style="margin-top:0;" id="t-settings">Настройки</h3>
            <label id="t-volume">Громкость звука:</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" onchange="updateVolume()">
            
            <label id="t-language">Язык:</label>
            <select id="lang-select" onchange="changeLanguage()">
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="zh">中文</option>
            </select>
            
            <button class="btn btn-green" onclick="closeSettings()" id="t-close">Закрыть</button>
        </div>
    </div>

    <!-- Шапка -->
    <div class="header">
        <span class="header-name" id="player-name">Игрок</span>
        <span>💰 <span id="balance">100000</span> ₽</span>
        <div class="menu-btn" onclick="openSettings()">⋮</div>
    </div>

    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('generator', this)" id="t-tab-gen">Номера</div>
        <div class="nav-tab" onclick="switchTab('inventory', this)" id="t-tab-inv">Инвентарь</div>
        <div class="nav-tab" onclick="switchTab('garage', this)" id="t-tab-gar">Гараж</div>
    </div>

    <!-- Генератор -->
    <div id="generator" class="tab-content">
        <div class="plate-container">
            <div class="plate-main">
                <span id="letter1">-</span>
                <span id="numbers" style="font-size: 44px; margin: 0 6px;">---</span>
                <span id="letter2">-</span>
                <span id="letter3">-</span>
            </div>
            <div class="plate-region" onclick="changeRegion()" title="Изменить регион">
                <span id="region">777</span>
                <div class="plate-region-text">RUS <div class="flag"></div></div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn" id="btn-spin-num" onclick="spinNumbers()">Крутить цифры (100 ₽)</button>
            <button class="btn btn-letters" id="btn-spin-let" onclick="spinLetters()">Крутить буквы (100 ₽)</button>
            <!-- Кнопка сохранения изначально заблокирована (disabled) -->
            <button class="btn btn-save" id="btn-save" onclick="savePlate()" disabled>Сохранить в инвентарь</button>
        </div>
    </div>

    <!-- Инвентарь -->
    <div id="inventory" class="tab-content hidden">
        <div class="inventory">
            <div id="inventory-list"></div>
        </div>
    </div>

    <!-- Гараж -->
    <div id="garage" class="tab-content hidden">
        <div class="garage">
            <div id="garage-list"></div>
            <h4 id="t-my-cars">Мой гараж:</h4>
            <div id="my-cars"></div>
        </div>
    </div>

    <script>
        // --- ДАННЫЕ И ЛОКАЛИЗАЦИЯ ---
        const dict = {
            ru: { settings: "Настройки", vol: "Громкость:", lang: "Язык:", close: "Закрыть", gen: "Номера", inv: "Инвентарь", gar: "Гараж", spin_n: "Крутить цифры (100 ₽)", spin_l: "Крутить буквы (100 ₽)", save: "Сохранить номер", no_money: "Недостаточно средств!", empty_inv: "Пусто...", my_cars: "Мой гараж:", sell: "Продать", buy: "Купить", reg_prompt: "Введите регион (1-3 цифры):" },
            en: { settings: "Settings", vol: "Volume:", lang: "Language:", close: "Close", gen: "Plates", inv: "Inventory", gar: "Garage", spin_n: "Spin Numbers (100 ₽)", spin_l: "Spin Letters (100 ₽)", save: "Save Plate", no_money: "Not enough money!", empty_inv: "Empty...", my_cars: "My cars:", sell: "Sell", buy: "Buy", reg_prompt: "Enter region (1-3 digits):" },
            es: { settings: "Ajustes", vol: "Volumen:", lang: "Idioma:", close: "Cerrar", gen: "Placas", inv: "Inventario", gar: "Garaje", spin_n: "Girar Números (100 ₽)", spin_l: "Girar Letras (100 ₽)", save: "Guardar", no_money: "¡Sin dinero!", empty_inv: "Vacío...", my_cars: "Mis autos:", sell: "Vender", buy: "Comprar", reg_prompt: "Región (1-3):" },
            zh: { settings: "设置", vol: "音量:", lang: "语言:", close: "关闭", gen: "车牌", inv: "库存", gar: "车库", spin_n: "旋转数字 (100 ₽)", spin_l: "旋转字母 (100 ₽)", save: "保存车牌", no_money: "钱不够！", empty_inv: "空的...", my_cars: "我的车:", sell: "卖", buy: "买", reg_prompt: "地区 (1-3):" }
        };
        let currentLang = 'ru';

        // Игровые переменные
        let balance = 100000;
        let nickname = '';
        let inventory = [];
        let myCars = [];
        let pityCounter = 0;
        
        let globalVolume = 0.5;
        let audioCtx = null;
        let isSpinning = false;

        // Новые переменные для блокировки кнопки Сохранить
        let hasLetters = false;
        let hasNumbers = false;
        let canSave = false;

        const lettersArr = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        const eliteLetters = ['ААА', 'АМР', 'ВВВ', 'ВОР', 'ТТТ', 'ХХХ', 'ККК', 'ЕКХ', 'АЕО'];
        const eliteNumbers = ['777', '888', '999', '666', '011'];

        // Изначально пусто
        let currentL1 = '-', currentL2 = '-', currentL3 = '-';
        let currentNum = '---';
        let currentReg = '777';

        // --- ИНИЦИАЛИЗАЦИЯ ---
        window.onload = function() {
            loadProgress();
            applyLanguage();
            checkCanSaveButton(); // Проверяем кнопку при запуске
            if (nickname !== '') {
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('player-name').innerText = nickname;
                updateBalance();
                renderInventory();
                renderCars();
            }
        };

        // --- ЗВУК И НАСТРОЙКИ ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTick() {
            if (!audioCtx || globalVolume <= 0) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(globalVolume * 0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); saveProgress(); }
        function updateVolume() { globalVolume = parseFloat(document.getElementById('volume-slider').value); }

        function changeLanguage() {
            currentLang = document.getElementById('lang-select').value;
            applyLanguage();
            saveProgress();
        }

        function applyLanguage() {
            let t = dict[currentLang];
            document.getElementById('t-settings').innerText = t.settings;
            document.getElementById('t-volume').innerText = t.vol;
            document.getElementById('t-language').innerText = t.lang;
            document.getElementById('t-close').innerText = t.close;
            document.getElementById('t-tab-gen').innerText = t.gen;
            document.getElementById('t-tab-inv').innerText = t.inv;
            document.getElementById('t-tab-gar').innerText = t.gar;
            document.getElementById('btn-spin-num').innerText = t.spin_n;
            document.getElementById('btn-spin-let').innerText = t.spin_l;
            document.getElementById('btn-save').innerText = t.save;
            document.getElementById('t-my-cars').innerText = t.my_cars;
            renderInventory();
            renderCars();
        }

        // --- ЛОГИКА ИГРЫ ---
        function registerUser() {
            const input = document.getElementById('nickname-input').value.trim();
            if (input.length < 2) return;
            nickname = input;
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('player-name').innerText = nickname;
            saveProgress();
            updateBalance();
        }

        function saveProgress() {
            localStorage.setItem('simGibdd_v2', JSON.stringify({
                balance, nickname, inventory, myCars, pityCounter, currentLang, globalVolume, currentReg
            }));
        }

        function loadProgress() {
            const saved = JSON.parse(localStorage.getItem('simGibdd_v2'));
            if (saved) {
                balance = saved.balance ?? 100000;
                nickname = saved.nickname || '';
                inventory = saved.inventory || [];
                myCars = saved.myCars || [];
                pityCounter = saved.pityCounter || 0;
                currentLang = saved.currentLang || 'ru';
                globalVolume = saved.globalVolume ?? 0.5;
                currentReg = saved.currentReg || '777';
                
                document.getElementById('lang-select').value = currentLang;
                document.getElementById('volume-slider').value = globalVolume;
                document.getElementById('region').innerText = currentReg;
            }
        }

        function updateBalance() { document.getElementById('balance').innerText = balance.toLocaleString('ru-RU'); }
        function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function checkCanSaveButton() {
            if (hasLetters && hasNumbers && canSave) {
                document.getElementById('btn-save').disabled = false;
            } else {
                document.getElementById('btn-save').disabled = true;
            }
        }

        // Анимация кручения цифр (ЗАМЕДЛЕНА)
        function spinNumbers() {
            if (isSpinning) return;
            if (balance < 100) return alert(dict[currentLang].no_money);
            balance -= 100;
            updateBalance();
            isSpinning = true;
            canSave = false; // Блокируем сохранение во время кручения
            checkCanSaveButton();
            initAudio();

            let finalNum = Math.floor(Math.random() * 999).toString().padStart(3, '0');
            let ticks = 0;
            
            let interval = setInterval(() => {
                playTick();
                if (ticks < 15) {
                    currentNum = Math.floor(Math.random() * 999).toString().padStart(3, '0');
                } else {
                    currentNum = finalNum;
                    clearInterval(interval);
                    isSpinning = false;
                    hasNumbers = true;
                    canSave = true; // Разрешаем сохранение, если обе части готовы
                    checkCanSaveButton();
                    saveProgress();
                }
                document.getElementById('numbers').innerText = currentNum;
                ticks++;
            }, 100); // 100 мс вместо 40
        }

        // Анимация кручения букв (ЗАМЕДЛЕНА)
        function spinLetters() {
            if (isSpinning) return;
            if (balance < 100) return alert(dict[currentLang].no_money);
            balance -= 100;
            updateBalance();
            isSpinning = true;
            canSave = false;
            checkCanSaveButton();
            initAudio();
            pityCounter++;

            let finalL1, finalL2, finalL3;
            
            let chance = pityCounter >= 400 ? ((pityCounter - 399) * 0.5) : (1 / 400);
            
            if (Math.random() < chance) {
                let elite = randomItem(eliteLetters);
                finalL1 = elite[0]; finalL2 = elite[1]; finalL3 = elite[2];
                pityCounter = 0; // Сброс гаранта
            } else {
                finalL1 = randomItem(lettersArr);
                finalL2 = randomItem(lettersArr);
                finalL3 = randomItem(lettersArr);
            }

            let ticks = 0;
            let interval = setInterval(() => {
                playTick();
                if (ticks < 10) {
                    currentL1 = randomItem(lettersArr); currentL2 = randomItem(lettersArr); currentL3 = randomItem(lettersArr);
                } else if (ticks < 15) {
                    currentL1 = finalL1; currentL2 = randomItem(lettersArr); currentL3 = randomItem(lettersArr);
                } else if (ticks < 20) {
                    currentL2 = finalL2; currentL3 = randomItem(lettersArr);
                } else {
                    currentL3 = finalL3;
                    clearInterval(interval);
                    isSpinning = false;
                    hasLetters = true;
                    canSave = true;
                    checkCanSaveButton();
                    saveProgress();
                }
                document.getElementById('letter1').innerText = currentL1;
                document.getElementById('letter2').innerText = currentL2;
                document.getElementById('letter3').innerText = currentL3;
                ticks++;
            }, 100); // 100 мс вместо 40
        }

        function changeRegion() {
            if (isSpinning) return;
            let newReg = prompt(dict[currentLang].reg_prompt, currentReg);
            if (newReg && newReg.length > 0 && newReg.length <= 3 && !isNaN(newReg)) {
                currentReg = newReg;
                document.getElementById('region').innerText = currentReg;
                saveProgress();
            }
        }

        // --- ЦЕНООБРАЗОВАНИЕ ---
        function calculatePrice() {
            let price = 2000;
            let lString = currentL1 + currentL2 + currentL3;
            let nString = currentNum;
            
            let isSameLetters = (currentL1 === currentL2 && currentL2 === currentL3);
            let isMirrorLetters = (currentL1 === currentL3 && currentL1 !== currentL2);
            
            let isSameNumbers = (nString[0] === nString[1] && nString[1] === nString[2]);
            let isMirrorNumbers = (nString[0] === nString[2] && nString[0] !== nString[1]);
            
            let isEliteLetters = eliteLetters.includes(lString);
            let isEliteNumbers = eliteNumbers.includes(nString);

            if (isEliteLetters && isEliteNumbers) return 10000000;

            if (isEliteLetters) price += 2000000;

            if (isSameLetters && !isEliteLetters && isSameNumbers) {
                price = Math.floor(Math.random() * (1500000 - 700000 + 1)) + 700000;
            } 
            else if (isSameLetters && !isEliteLetters && isMirrorNumbers) {
                price += 50000;
            } 
            else if (isSameLetters && !isEliteLetters) {
                price += 30000;
            }
            else if (isMirrorLetters && isMirrorNumbers) {
                price += 15000; 
            }
            else if (isSameNumbers) {
                price += 10000;
            }
            else if (isMirrorLetters || isMirrorNumbers) {
                price += 3000;
            }

            return price;
        }

        function savePlate() {
            if (isSpinning || !canSave || !hasLetters || !hasNumbers) return;
            
            let price = calculatePrice();
            let plateStr = `${currentL1} ${currentNum} ${currentL2}${currentL3} | ${currentReg} RUS`;
            inventory.unshift({ text: plateStr, price: price });
            renderInventory();
            
            // СРАЗУ блокируем кнопку после сохранения
            canSave = false;
            checkCanSaveButton();
            
            saveProgress();
        }

        function renderInventory() {
            let list = document.getElementById('inventory-list');
            if (inventory.length === 0) {
                list.innerHTML = dict[currentLang].empty_inv;
                return;
            }
            list.innerHTML = '';
            inventory.forEach((item, index) => {
                let color = item.price >= 100000 ? '#ffd700' : (item.price >= 15000 ? '#a5d6a7' : '#ddd'); 
                list.innerHTML += `
                    <div class="item">
                        <div>
                            <b style="letter-spacing: 1px; color: ${color};">${item.text}</b><br>
                            <small style="color: #888;">${item.price.toLocaleString('ru-RU')} ₽</small>
                        </div>
                        <button onclick="sellPlate(${index}, ${item.price})">${dict[currentLang].sell}<br>+${(item.price >= 1000000 ? (item.price/1000000).toFixed(1) + 'М' : item.price.toLocaleString('ru-RU'))}</button>
                    </div>`;
            });
        }

        function sellPlate(index, price) {
            inventory.splice(index, 1);
            balance += price;
            updateBalance();
            renderInventory();
            saveProgress();
        }

        // --- МАГАЗИН И ТАБЫ ---
        const carsData = [
            { name: "Lada Granta", price: 50000 },
            { name: "Kalina 1 Sport", price: 150000 }
        ];

        function renderCars() {
            let list = document.getElementById('garage-list');
            let myCarsDiv = document.getElementById('my-cars');
            list.innerHTML = '';
            
            carsData.forEach(car => {
                list.innerHTML += `
                    <div class="item">
                        <div>${car.name}<br><small>${car.price.toLocaleString('ru-RU')} ₽</small></div>
                        <button class="buy" onclick="buyCar('${car.name}', ${car.price})">${dict[currentLang].buy}</button>
                    </div>`;
            });

            myCarsDiv.innerHTML = myCars.length === 0 ? dict[currentLang].empty_inv : '';
            myCars.forEach(car => {
                myCarsDiv.innerHTML += `<div class="item" style="justify-content: center;"><b>${car}</b></div>`;
            });
        }

        function buyCar(name, price) {
            if (balance < price) return alert(dict[currentLang].no_money);
            balance -= price;
            myCars.push(name);
            updateBalance();
            renderCars();
            saveProgress();
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            element.classList.add('active');
        }
    </script>
</body>
</html>
