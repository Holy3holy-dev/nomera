<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Номеров</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1e1e1e; color: white; text-align: center; margin: 0; padding: 10px; }
        
        /* Экран регистрации */
        #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30, 30, 30, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        #auth-modal input { padding: 15px; font-size: 20px; border-radius: 8px; border: none; margin-bottom: 20px; text-align: center; width: 80%; max-width: 300px; outline: none; }
        
        .header { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 20px; background: #333; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); align-items: center; }
        .header-name { color: #4CAF50; font-size: 20px; }
        
        /* Дизайн автомобильного номера */
        .plate-container { background: white; color: black; border: 3px solid black; border-radius: 8px; padding: 10px 15px; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; margin: 20px auto; width: fit-content; font-family: 'Arial Black', sans-serif; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .plate-main { display: flex; align-items: center; padding-right: 15px; border-right: 2px solid black; }
        .plate-region { display: flex; flex-direction: column; align-items: center; padding-left: 15px; font-size: 26px; }
        .plate-region-text { font-size: 14px; display: flex; align-items: center; margin-top: 2px; }
        .flag { width: 18px; height: 12px; background: linear-gradient(to bottom, white 33%, blue 33%, blue 66%, red 66%); margin-left: 5px; border: 1px solid #ccc; }
        
        /* Кнопки */
        .btn { background: #4CAF50; color: white; border: none; padding: 15px 20px; font-size: 18px; border-radius: 8px; cursor: pointer; margin: 10px 0; width: 100%; font-weight: bold; box-shadow: 0 4px 0 #2E7D32; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-blue { background: #2196F3; box-shadow: 0 4px 0 #1565C0; }
        .btn-orange { background: #FF9800; box-shadow: 0 4px 0 #E65100; }
        
        /* Блоки и табы */
        .inventory, .garage { background: #2a2a2a; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: left; }
        .item { background: #444; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item button { background: #f44336; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; }
        .item button.buy { background: #4CAF50; }
        
        .nav-tabs { display: flex; justify-content: space-around; margin-top: 10px; background: #333; border-radius: 10px; padding: 5px; }
        .nav-tab { padding: 12px; cursor: pointer; font-weight: bold; border-radius: 8px; flex-grow: 1; transition: 0.3s; }
        .nav-tab.active { background: #4CAF50; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Окно регистрации -->
    <div id="auth-modal">
        <h2 style="color: #4CAF50;">Добро пожаловать!</h2>
        <p>Придумайте никнейм для игры:</p>
        <input type="text" id="nickname-input" placeholder="Ваш никнейм" maxlength="15">
        <button class="btn btn-blue" style="width: 80%; max-width: 300px;" onclick="registerUser()">Начать игру</button>
    </div>

    <!-- Шапка игры -->
    <div class="header">
        <span class="header-name" id="player-name">Игрок</span>
        <span>💰 <span id="balance">100000</span> ₽</span>
    </div>

    <!-- Навигация -->
    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('generator', this)">Номера</div>
        <div class="nav-tab" onclick="switchTab('inventory', this)">Инвентарь</div>
        <div class="nav-tab" onclick="switchTab('garage', this)">Гараж</div>
    </div>

    <!-- Вкладка 1: Генератор номеров -->
    <div id="generator" class="tab-content">
        <div class="plate-container">
            <div class="plate-main">
                <span id="letter1">А</span>
                <span id="numbers" style="font-size: 48px; margin: 0 8px;">000</span>
                <span id="letter2">А</span>
                <span id="letter3">А</span>
            </div>
            <div class="plate-region">
                <span id="region">777</span>
                <div class="plate-region-text">RUS <div class="flag"></div></div>
            </div>
        </div>

        <button class="btn" onclick="spinNumbers()">Крутить цифры (100 ₽)</button>
        <button class="btn btn-blue" onclick="spinLetters()">Крутить буквы (100 ₽)</button>
        <button class="btn btn-orange" onclick="savePlate()">Сохранить в инвентарь</button>
    </div>

    <!-- Вкладка 2: Инвентарь -->
    <div id="inventory" class="tab-content hidden">
        <div class="inventory">
            <h3>Мои сохраненные номера</h3>
            <div id="inventory-list">У вас пока нет номеров...</div>
        </div>
    </div>

    <!-- Вкладка 3: Гараж -->
    <div id="garage" class="tab-content hidden">
        <div class="garage">
            <h3>Автосалон</h3>
            <div id="garage-list">
                <div class="item">
                    <div>🚗 Лада Гранта <br><small>50,000 ₽</small></div>
                    <button class="buy" onclick="buyCar('Лада Гранта', 50000)">Купить</button>
                </div>
                <div class="item">
                    <div>🔥 Калина 1 Спорт <br><small style="color:#aaa">Она симпатичнее, динамичнее и комплектация лучше!</small><br><b>150,000 ₽</b></div>
                    <button class="buy" onclick="buyCar('Калина 1 Спорт', 150000)">Купить</button>
                </div>
            </div>
            <h3>Мой гараж:</h3>
            <div id="my-cars">Гараж пуст</div>
        </div>
    </div>

    <!-- Логика игры -->
    <script>
        // Игровые переменные
        let balance = 100000;
        let nickname = '';
        let inventory = []; // Теперь хранит объекты: { text: "А 000 АА | 777 RUS", price: 2000 }
        let myCars = [];
        const spinCost = 100; 

        const lettersArr = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        const eliteLetters = ['ААА', 'АМР', 'ВВВ', 'ВОР', 'ТТТ', 'ХХХ', 'ККК', 'ЕКХ', 'АЕО'];
        const eliteNumbers = ['777', '888', '999', '666', '011'];

        let currentL1 = 'А', currentL2 = 'А', currentL3 = 'А';
        let currentNum = '000';
        let currentReg = '777';

        // Запуск
        window.onload = function() {
            loadProgress();
            if (nickname !== '') {
                document.getElementById('auth-modal').style.display = 'none';
                document.getElementById('player-name').innerText = nickname;
                updateBalance();
                renderInventory();
                renderCars();
            }
        };

        // Регистрация
        function registerUser() {
            const input = document.getElementById('nickname-input').value.trim();
            if (input.length < 2) return alert('Никнейм должен состоять минимум из 2 символов!');
            
            nickname = input;
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('player-name').innerText = nickname;
            
            saveProgress();
            updateBalance();
        }

        // Сохранение и загрузка
        function saveProgress() {
            const gameData = {
                balance: balance,
                nickname: nickname,
                inventory: inventory,
                myCars: myCars
            };
            localStorage.setItem('simulatorGibddSave', JSON.stringify(gameData));
        }

        function loadProgress() {
            const savedData = localStorage.getItem('simulatorGibddSave');
            if (savedData) {
                const parsedData = JSON.parse(savedData);
                balance = parsedData.balance !== undefined ? parsedData.balance : 100000;
                nickname = parsedData.nickname || '';
                inventory = parsedData.inventory || [];
                myCars = parsedData.myCars || [];
            }
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance.toLocaleString('ru-RU');
        }

        function randomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Прокрутка
        function spinNumbers() {
            if (balance < spinCost) return alert('Недостаточно средств!');
            balance -= spinCost;
            currentNum = Math.floor(Math.random() * 999).toString().padStart(3, '0');
            document.getElementById('numbers').innerText = currentNum;
            updateBalance();
            saveProgress();
        }

        function spinLetters() {
            if (balance < spinCost) return alert('Недостаточно средств!');
            balance -= spinCost;
            currentL1 = randomItem(lettersArr);
            currentL2 = randomItem(lettersArr);
            currentL3 = randomItem(lettersArr);
            document.getElementById('letter1').innerText = currentL1;
            document.getElementById('letter2').innerText = currentL2;
            document.getElementById('letter3').innerText = currentL3;
            updateBalance();
            saveProgress();
        }

        // Логика расчета стоимости номера
        function calculatePrice() {
            let price = 2000; // Базовая цена
            
            let lString = currentL1 + currentL2 + currentL3; // Все буквы вместе
            let nString = currentNum; // Цифры (строка)
            
            let isSameLetters = (currentL1 === currentL2 && currentL2 === currentL3);
            let isSameNumbers = (nString[0] === nString[1] && nString[1] === nString[2]);
            let isMirrorNumbers = (nString[0] === nString[2] && nString[0] !== nString[1]);
            
            let isEliteLetters = eliteLetters.includes(lString);
            let isEliteNumbers = eliteNumbers.includes(nString);

            // Джекпот
            if (isEliteLetters && isEliteNumbers) {
                return 10000000;
            }

            // Блатные серии (например ААА, АМР)
            if (isEliteLetters) {
                price += 2000000;
            }

            // Три одинаковые буквы + зеркальные цифры (но не блатная серия)
            if (isSameLetters && !isEliteLetters && isMirrorNumbers) {
                price += 50000; // 30k за буквы + 20k за зеркало
            } 
            // Просто три одинаковые буквы
            else if (isSameLetters && !isEliteLetters) {
                price += 30000;
            }

            // Три одинаковые цифры И три одинаковые буквы (но не вошедшие в элиту)
            if (isSameLetters && !isEliteLetters && isSameNumbers) {
                // Рандом от 700 000 до 1 500 000
                price = Math.floor(Math.random() * (1500000 - 700000 + 1)) + 700000;
            }

            return price;
        }

        // Инвентарь
        function savePlate() {
            let price = calculatePrice();
            let plateStr = `${currentL1} ${currentNum} ${currentL2}${currentL3} | ${currentReg} RUS`;
            
            // Сохраняем объект
            inventory.unshift({ text: plateStr, price: price });
            
            alert(`Номер сохранен! Его стоимость: ${price.toLocaleString('ru-RU')} ₽`);
            renderInventory();
            saveProgress();
        }

        function renderInventory() {
            let list = document.getElementById('inventory-list');
            if (inventory.length === 0) {
                list.innerHTML = 'У вас пока нет номеров...';
                return;
            }
            list.innerHTML = '';
            inventory.forEach((item, index) => {
                // Подсветка дорогих номеров
                let color = item.price > 100000 ? '#FFD700' : 'white'; 
                list.innerHTML += `
                    <div class="item">
                        <div style="display: flex; flex-direction: column;">
                            <b style="font-family: 'Arial Black', sans-serif; letter-spacing: 1px; color: ${color};">${item.text}</b>
                            <small style="color: #aaa;">Оценка: ${item.price.toLocaleString('ru-RU')} ₽</small>
                        </div>
                        <button onclick="sellPlate(${index}, ${item.price})">Продать<br>+${(item.price >= 1000000 ? (item.price/1000000).toFixed(1) + 'М' : item.price.toLocaleString('ru-RU'))}</button>
                    </div>`;
            });
        }

        function sellPlate(index, price) {
            inventory.splice(index, 1);
            balance += price;
            updateBalance();
            renderInventory();
            saveProgress();
        }

        // Гараж и покупка машин
        function buyCar(name, price) {
            if (balance < price) return alert('Не хватает денег на покупку!');
            balance -= price;
            myCars.push(name);
            updateBalance();
            renderCars();
            saveProgress();
            alert(`Поздравляем! Вы купили: ${name}`);
        }

        function renderCars() {
            let list = document.getElementById('my-cars');
            if (myCars.length === 0) {
                list.innerHTML = 'Гараж пуст';
                return;
            }
            list.innerHTML = '';
            myCars.forEach(car => {
                list.innerHTML += `<div class="item" style="justify-content: center; font-size: 18px;"><b>${car}</b></div>`;
            });
        }

        // Переключение вкладок
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.remove('hidden');
            element.classList.add('active');
        }

        // Регистрация PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
