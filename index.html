<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Номеров</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1a1a1a; color: #ddd; text-align: center; margin: 0; padding: 10px; user-select: none; }
        
        /* Модальные окна */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #2a2a2a; padding: 20px; border-radius: 12px; width: 80%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-box input[type="text"], .modal-box select { padding: 12px; font-size: 16px; border-radius: 6px; border: none; margin-bottom: 20px; width: 90%; background: #444; color: white; outline: none; }
        .modal-box input[type="range"] { width: 100%; margin: 15px 0; }
        
        .modal-plates { max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; text-align: left; }
        
        /* Шапка */
        .header { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 20px; background: #252525; padding: 15px; border-radius: 8px; align-items: center; }
        .header-name { color: #66bb6a; font-weight: bold; }
        .menu-btn { font-size: 24px; cursor: pointer; padding: 0 10px; color: #888; }
        
        /* Номер */
        .plate-container { background: white; color: black; border: 3px solid #222; border-radius: 6px; padding: 10px 15px; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; margin: 30px auto; width: fit-content; font-family: 'Arial Black', sans-serif; box-shadow: 0 6px 15px rgba(0,0,0,0.7); }
        .plate-main { display: flex; align-items: center; padding-right: 15px; border-right: 2px solid black; }
        .plate-region { display: flex; flex-direction: column; align-items: center; padding-left: 15px; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .plate-region:active { opacity: 0.5; }
        .plate-region-text { font-size: 12px; display: flex; align-items: center; margin-top: 2px; }
        .flag { width: 18px; height: 12px; background: linear-gradient(to bottom, white 33%, blue 33%, blue 66%, red 66%); margin-left: 5px; border: 1px solid #999; }
        
        .mini-plate { background: white; color: black; border: 2px solid black; border-radius: 4px; padding: 5px 10px; font-family: 'Arial Black', sans-serif; font-size: 18px; font-weight: bold; display: inline-block; margin: 5px 0; }
        
        /* Кнопки */
        .btn-container { margin: 20px 0; display: flex; flex-direction: column; gap: 15px; }
        .btn { background: #444; color: #eee; border: none; padding: 14px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; width: 100%; box-shadow: 0 3px 0 #222; transition: 0.1s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
        .btn-letters { background: #3a4a5a; box-shadow: 0 3px 0 #1a2a3a; }
        .btn-save { background: #5a4a3a; box-shadow: 0 3px 0 #3a2a1a; margin-top: 10px; }
        .btn-green { background: #3a5a3a; box-shadow: 0 3px 0 #1a3a1a; margin-top: 10px; }
        .btn-close { background: #6a3a3a; box-shadow: 0 3px 0 #3a1a1a; margin-top: 10px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; transform: none; }
        
        /* Табы и списки */
        .inventory, .garage { background: #222; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; }
        .item { background: #333; padding: 12px; margin: 10px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; flex-wrap: wrap; gap: 10px; }
        .item button { background: #6a3a3a; color: white; border: none; padding: 8px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; flex-grow: 1; }
        .item button.buy { background: #3a5a3a; }
        .item button.blue { background: #3a4a5a; }
        
        .nav-tabs { display: flex; justify-content: space-around; background: #252525; border-radius: 8px; padding: 5px; }
        .nav-tab { padding: 12px; cursor: pointer; font-size: 14px; border-radius: 6px; flex-grow: 1; transition: 0.3s; color: #999; }
        .nav-tab.active { background: #444; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Окно регистрации -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0; color: #66bb6a;">Добро пожаловать</h3>
            <input type="text" id="nickname-input" placeholder="Ваш никнейм" maxlength="15">
            <button class="btn btn-green" onclick="registerUser()">Начать</button>
        </div>
    </div>

    <!-- Настройки -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0;">Настройки</h3>
            <label>Громкость звука:</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" onchange="updateVolume()">
            <button class="btn btn-close" onclick="closeSettings()">Закрыть</button>
        </div>
    </div>

    <!-- Выбор номера для установки -->
    <div id="attach-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 360px;">
            <h3 style="margin-top:0; color: #fff;">Выберите номер</h3>
            <div id="attach-list" class="modal-plates"></div>
            <button class="btn btn-close" onclick="closeAttachModal()">Отмена</button>
        </div>
    </div>

    <!-- Шапка -->
    <div class="header">
        <span class="header-name" id="player-name">Игрок</span>
        <span>💰 <span id="balance">100000</span> ₽</span>
        <div class="menu-btn" onclick="openSettings()">⋮</div>
    </div>

    <!-- Навигация -->
    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('generator', this)">Номера</div>
        <div class="nav-tab" onclick="switchTab('inventory', this)">Инвентарь</div>
        <div class="nav-tab" onclick="switchTab('garage', this)">Гараж</div>
    </div>

    <!-- Генератор -->
    <div id="generator" class="tab-content">
        <div class="plate-container">
            <div class="plate-main">
                <span id="letter1">-</span>
                <span id="numbers" style="font-size: 44px; margin: 0 6px;">---</span>
                <span id="letter2">-</span>
                <span id="letter3">-</span>
            </div>
            <div class="plate-region" onclick="changeRegion()" title="Изменить регион">
                <span id="region">777</span>
                <div class="plate-region-text">RUS <div class="flag"></div></div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="spinNumbers()">Крутить цифры (100 ₽)</button>
            <button class="btn btn-letters" onclick="spinLetters()">Крутить буквы (100 ₽)</button>
            <button class="btn btn-save" id="btn-save" onclick="savePlate()" disabled>Сохранить в инвентарь</button>
        </div>
    </div>

    <!-- Инвентарь -->
    <div id="inventory" class="tab-content hidden">
        <div class="inventory">
            <div id="inventory-list"></div>
        </div>
    </div>

    <!-- Гараж -->
    <div id="garage" class="tab-content hidden">
        <div class="garage">
            <h3>Автосалон</h3>
            <div id="garage-list"></div>
            <h3>Мой гараж:</h3>
            <div id="my-cars"></div>
        </div>
    </div>

    <script>
        const carsData = [
            { name: "Lada Granta", price: 50000 },
            { name: "Kalina 1 Sport", price: 150000 }
        ];

        let balance = 100000;
        let nickname = '';
        let inventory = []; 
        let myCars = [];    
        let pityCounter = 0;
        let globalVolume = 0.5;
        let audioCtx = null;
        let isSpinning = false;
        
        let hasLetters = false;
        let hasNumbers = false;
        let canSave = false;
        
        let currentCarIndexForAttach = -1; 

        const lettersArr = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        const eliteLetters = ['ААА', 'АМР', 'ВВВ', 'ВОР', 'ТТТ', 'ХХХ', 'ККК', 'ЕКХ', 'АЕО'];
        const eliteNumbers = ['777', '888', '999', '666', '011'];

        let currentL1 = '-', currentL2 = '-', currentL3 = '-';
        let currentNum = '---';
        let currentReg = '777';

        // --- ИНИЦИАЛИЗАЦИЯ И МИГРАЦИЯ СОХРАНЕНИЙ ---
        window.onload = function() {
            loadProgress();
            
            if (nickname === '') {
                document.getElementById('auth-modal').classList.add('show');
            } else {
                document.getElementById('player-name').innerText = nickname;
            }

            checkCanSaveButton();
            updateBalance();
            renderInventory();
            renderCars();
        };

        function registerUser() {
            const input = document.getElementById('nickname-input').value.trim();
            if (input.length < 2) return;
            nickname = input;
            document.getElementById('auth-modal').classList.remove('show');
            document.getElementById('player-name').innerText = nickname;
            saveProgress();
        }

        function saveProgress() {
            // Сохраняем в новую версию
            localStorage.setItem('simGibdd_v4', JSON.stringify({
                balance, nickname, inventory, myCars, pityCounter, globalVolume, currentReg
            }));
        }

        function loadProgress() {
            // Умная загрузка: ищем от самой новой версии к самым старым, чтобы не потерять прогресс
            let savedStr = localStorage.getItem('simGibdd_v4') || 
                           localStorage.getItem('simGibdd_v3') || 
                           localStorage.getItem('simGibdd_v2') || 
                           localStorage.getItem('simulatorGibddSave');
                           
            if (savedStr) {
                const saved = JSON.parse(savedStr);
                balance = saved.balance ?? 100000;
                nickname = saved.nickname || '';
                inventory = saved.inventory || [];
                pityCounter = saved.pityCounter || 0;
                globalVolume = saved.globalVolume ?? 0.5;
                currentReg = saved.currentReg || '777';
                
                document.getElementById('volume-slider').value = globalVolume;
                document.getElementById('region').innerText = currentReg;
                
                // Миграция машин для совсем старых сохранений
                if (saved.myCars && saved.myCars.length > 0 && typeof saved.myCars[0] === 'string') {
                    myCars = saved.myCars.map(carName => {
                        let carData = carsData.find(c => c.name === carName);
                        return { name: carName, basePrice: carData ? carData.price : 50000, plate: null };
                    });
                } else {
                    myCars = saved.myCars || [];
                }
            }
        }

        // --- ЗВУК ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTick() {
            if (!audioCtx || globalVolume <= 0) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(globalVolume * 0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function openSettings() { document.getElementById('settings-modal').classList.add('show'); }
        function closeSettings() { document.getElementById('settings-modal').classList.remove('show'); saveProgress(); }
        function updateVolume() { globalVolume = parseFloat(document.getElementById('volume-slider').value); }
        function updateBalance() { document.getElementById('balance').innerText = balance.toLocaleString('ru-RU'); }
        function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function checkCanSaveButton() {
            document.getElementById('btn-save').disabled = !(hasLetters && hasNumbers && canSave);
        }

        // --- ГЕНЕРАТОР ---
        function spinNumbers() {
            if (isSpinning) return;
            if (balance < 100) return alert('Недостаточно средств!');
            balance -= 100;
            updateBalance();
            isSpinning = true;
            canSave = false;
            checkCanSaveButton();
            initAudio();

            let finalNum = Math.floor(Math.random() * 999).toString().padStart(3, '0');
            let ticks = 0;
            
            let interval = setInterval(() => {
                playTick();
                if (ticks < 15) {
                    currentNum = Math.floor(Math.random() * 999).toString().padStart(3, '0');
                } else {
                    currentNum = finalNum;
                    clearInterval(interval);
                    isSpinning = false;
                    hasNumbers = true;
                    canSave = true;
                    checkCanSaveButton();
                    saveProgress();
                }
                document.getElementById('numbers').innerText = currentNum;
                ticks++;
            }, 100);
        }

        function spinLetters() {
            if (isSpinning) return;
            if (balance < 100) return alert('Недостаточно средств!');
            balance -= 100;
            updateBalance();
            isSpinning = true;
            canSave = false;
            checkCanSaveButton();
            initAudio();
            pityCounter++;

            let finalL1, finalL2, finalL3;
            let chance = pityCounter >= 400 ? ((pityCounter - 399) * 0.5) : (1 / 400);
            
            if (Math.random() < chance) {
                let elite = randomItem(eliteLetters);
                finalL1 = elite[0]; finalL2 = elite[1]; finalL3 = elite[2];
                pityCounter = 0;
            } else {
                finalL1 = randomItem(lettersArr); finalL2 = randomItem(lettersArr); finalL3 = randomItem(lettersArr);
            }

            let ticks = 0;
            let interval = setInterval(() => {
                playTick();
                if (ticks < 10) {
                    currentL1 = randomItem(lettersArr); currentL2 = randomItem(lettersArr); currentL3 = randomItem(lettersArr);
                } else if (ticks < 15) {
                    currentL1 = finalL1; currentL2 = randomItem(lettersArr); currentL3 = randomItem(lettersArr);
                } else if (ticks < 20) {
                    currentL2 = finalL2; currentL3 = randomItem(lettersArr);
                } else {
                    currentL3 = finalL3;
                    clearInterval(interval);
                    isSpinning = false;
                    hasLetters = true;
                    canSave = true;
                    checkCanSaveButton();
                    saveProgress();
                }
                document.getElementById('letter1').innerText = currentL1;
                document.getElementById('letter2').innerText = currentL2;
                document.getElementById('letter3').innerText = currentL3;
                ticks++;
            }, 100);
        }

        function changeRegion() {
            if (isSpinning) return;
            let newReg = prompt("Введите регион (1-3 цифры):", currentReg);
            if (newReg && newReg.length > 0 && newReg.length <= 3 && !isNaN(newReg)) {
                currentReg = newReg;
                document.getElementById('region').innerText = currentReg;
                saveProgress();
            }
        }

        // --- ИСПРАВЛЕННОЕ ЦЕНООБРАЗОВАНИЕ ---
        function calculatePrice() {
            let price = 2000;
            let lString = currentL1 + currentL2 + currentL3;
            let nString = currentNum;
            
            let isSameLetters = (currentL1 === currentL2 && currentL2 === currentL3);
            let isMirrorLetters = (currentL1 === currentL3 && currentL1 !== currentL2);
            let isSameNumbers = (nString[0] === nString[1] && nString[1] === nString[2]);
            let isMirrorNumbers = (nString[0] === nString[2] && nString[0] !== nString[1]);
            
            let isEliteLetters = eliteLetters.includes(lString);
            let isEliteNumbers = eliteNumbers.includes(nString);

            // 1. Супер-джекпот
            if (isEliteLetters && isEliteNumbers) return 10000000;
            
            // 2. Блатные буквы сразу дают фикс надбавку
            if (isEliteLetters) price += 2000000;

            // 3. Если 3 одинаковые буквы и 3 одинаковые цифры (но буквы не из блатного списка)
            if (isSameLetters && !isEliteLetters && isSameNumbers) {
                return Math.floor(Math.random() * (1500000 - 700000 + 1)) + 700000;
            }

            // 4. Суммируемые бонусы. Теперь бонусы за буквы и цифры складываются вместе!
            
            // Проверка букв
            if (isSameLetters && !isEliteLetters) {
                price += 30000;
            } else if (isMirrorLetters && !isEliteLetters) {
                price += 10000;
            }

            // Проверка цифр
            if (isSameNumbers) {
                price += 35000;
            } else if (isMirrorNumbers) {
                price += 20000;
            }

            return price;
        }

        function savePlate() {
            if (isSpinning || !canSave || !hasLetters || !hasNumbers) return;
            let price = calculatePrice();
            let plateStr = `${currentL1} ${currentNum} ${currentL2}${currentL3} | ${currentReg} RUS`;
            inventory.unshift({ text: plateStr, price: price });
            canSave = false;
            checkCanSaveButton();
            renderInventory();
            saveProgress();
        }

        // --- ИНВЕНТАРЬ ---
        function renderInventory() {
            let list = document.getElementById('inventory-list');
            if (inventory.length === 0) {
                list.innerHTML = 'Пусто...';
                return;
            }
            list.innerHTML = '';
            inventory.forEach((item, index) => {
                let color = item.price >= 100000 ? '#ffd700' : (item.price >= 15000 ? '#a5d6a7' : '#ddd'); 
                list.innerHTML += `
                    <div class="item">
                        <div style="flex-grow: 1;">
                            <b style="letter-spacing: 1px; color: ${color}; font-size: 16px;">${item.text}</b><br>
                            <small style="color: #888;">${item.price.toLocaleString('ru-RU')} ₽</small>
                        </div>
                        <button onclick="sellPlate(${index}, ${item.price})">Продать<br>+${(item.price >= 1000000 ? (item.price/1000000).toFixed(1) + 'М' : item.price.toLocaleString('ru-RU'))}</button>
                    </div>`;
            });
        }

        function sellPlate(index, price) {
            inventory.splice(index, 1);
            balance += price;
            updateBalance();
            renderInventory();
            saveProgress();
        }

        // --- ГАРАЖ ---
        function renderCars() {
            let list = document.getElementById('garage-list');
            let myCarsDiv = document.getElementById('my-cars');
            list.innerHTML = '';
            
            carsData.forEach(car => {
                list.innerHTML += `
                    <div class="item">
                        <div><b>${car.name}</b><br><small>${car.price.toLocaleString('ru-RU')} ₽</small></div>
                        <button class="buy" style="max-width: 100px;" onclick="buyCar('${car.name}', ${car.price})">Купить</button>
                    </div>`;
            });

            if (myCars.length === 0) {
                myCarsDiv.innerHTML = 'Гараж пуст';
                return;
            }
            myCarsDiv.innerHTML = '';
            
            myCars.forEach((car, index) => {
                let carSellPrice = car.basePrice * 0.9;
                let html = `<div class="item" style="flex-direction: column; align-items: stretch;">`;
                html += `<div style="text-align: center; font-size: 18px; margin-bottom: 5px;"><b>${car.name}</b></div>`;
                
                if (car.plate) {
                    let detachCost = car.plate.price * 0.1;
                    let totalSellPrice = carSellPrice + (car.plate.price * 0.95);
                    html += `
                        <div style="text-align: center; margin-bottom: 10px;">
                            <div class="mini-plate">${car.plate.text}</div>
                        </div>
                        <div style="display: flex; gap: 5px; width: 100%;">
                            <button class="blue" onclick="detachPlate(${index})">Снять номер<br>-${detachCost.toLocaleString('ru-RU')} ₽</button>
                            <button onclick="sellCar(${index}, true)">Продать всё<br>+${(totalSellPrice >= 1000000 ? (totalSellPrice/1000000).toFixed(1) + 'М' : totalSellPrice.toLocaleString('ru-RU'))}</button>
                        </div>
                    `;
                } else {
                    html += `
                        <div style="display: flex; gap: 5px; width: 100%;">
                            <button class="buy" onclick="openAttachModal(${index})">Повесить номер</button>
                            <button onclick="sellCar(${index}, false)">Продать авто<br>+${carSellPrice.toLocaleString('ru-RU')} ₽</button>
                        </div>
                    `;
                }
                html += `</div>`;
                myCarsDiv.innerHTML += html;
            });
        }

        function buyCar(name, price) {
            if (balance < price) return alert('Недостаточно средств!');
            balance -= price;
            myCars.push({ name: name, basePrice: price, plate: null });
            updateBalance();
            renderCars();
            saveProgress();
        }

        function sellCar(index, hasPlate) {
            let car = myCars[index];
            let profit = car.basePrice * 0.9; 
            if (hasPlate && car.plate) profit += car.plate.price * 0.95; 
            balance += profit;
            myCars.splice(index, 1);
            updateBalance();
            renderCars();
            saveProgress();
        }

        function detachPlate(index) {
            let car = myCars[index];
            let cost = car.plate.price * 0.1; 
            if (balance < cost) return alert(`Не хватает денег на снятие! Нужно ${cost.toLocaleString('ru-RU')} ₽`);
            balance -= cost;
            inventory.unshift(car.plate); 
            car.plate = null; 
            updateBalance();
            renderCars();
            renderInventory();
            saveProgress();
        }

        // --- УСТАНОВКА НОМЕРА ---
        function openAttachModal(carIndex) {
            currentCarIndexForAttach = carIndex;
            let list = document.getElementById('attach-list');
            list.innerHTML = '';
            
            if (inventory.length === 0) {
                list.innerHTML = '<div style="color: #888; text-align: center;">У вас нет номеров в инвентаре</div>';
            } else {
                inventory.forEach((item, invIndex) => {
                    let color = item.price >= 100000 ? '#ffd700' : 'white';
                    list.innerHTML += `
                        <div style="background: #333; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <b style="color: ${color}">${item.text}</b><br>
                                <small>${item.price.toLocaleString('ru-RU')} ₽</small>
                            </div>
                            <button class="btn btn-green" style="width: auto; padding: 8px 12px; margin: 0;" onclick="attachPlate(${invIndex})">Выбрать</button>
                        </div>
                    `;
                });
            }
            document.getElementById('attach-modal').classList.add('show');
        }

        function closeAttachModal() {
            document.getElementById('attach-modal').classList.remove('show');
            currentCarIndexForAttach = -1;
        }

        function attachPlate(invIndex) {
            if (currentCarIndexForAttach === -1) return;
            let car = myCars[currentCarIndexForAttach];
            let plate = inventory[invIndex];
            inventory.splice(invIndex, 1);
            car.plate = plate;
            closeAttachModal();
            renderCars();
            renderInventory();
            saveProgress();
        }

        // --- ВКЛАДКИ ---
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            element.classList.add('active');
        }
    </script>
</body>
