<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Номеров</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1a1a1a; color: #ddd; text-align: center; margin: 0; padding: 10px; user-select: none; }
        
        /* Модальные окна */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #2a2a2a; padding: 20px; border-radius: 12px; width: 85%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-height: 80vh; overflow-y: auto; }
        .modal-box input[type="text"], .modal-box select { padding: 12px; font-size: 16px; border-radius: 6px; border: none; margin-bottom: 20px; width: 90%; background: #444; color: white; outline: none; }
        .modal-box input[type="range"] { width: 100%; margin: 15px 0; }
        .modal-box input[type="file"] { margin-bottom: 20px; color: white; width: 90%; }
        
        /* Шапка и профиль */
        .header { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 20px; background: #252525; padding: 15px; border-radius: 8px; align-items: center; }
        .profile-section { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px; border-radius: 8px; transition: 0.2s; }
        .profile-section:active { background: #444; }
        .header-name { color: #66bb6a; font-weight: bold; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background-color: #444; border: 2px solid #66bb6a; }
        .menu-btn { font-size: 24px; cursor: pointer; padding: 0 10px; color: #888; }
        
        /* Номер */
        .plate-container { position: relative; background: white; color: black; border: 3px solid #222; border-radius: 6px; padding: 10px 15px; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; margin: 35px auto 15px auto; width: fit-content; font-family: 'Arial Black', sans-serif; box-shadow: 0 6px 15px rgba(0,0,0,0.7); }
        .plate-main { display: flex; align-items: center; padding-right: 15px; border-right: 2px solid black; }
        .plate-region { display: flex; flex-direction: column; align-items: center; padding-left: 15px; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .plate-region:active { opacity: 0.5; }
        .plate-region-text { font-size: 12px; display: flex; align-items: center; margin-top: 2px; }
        .flag { width: 18px; height: 12px; background: linear-gradient(to bottom, white 33%, blue 33%, blue 66%, red 66%); margin-left: 5px; border: 1px solid #999; }
        
        /* Редкость и Цена */
        .rarity-label { position: absolute; top: -14px; left: -10px; font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; z-index: 10; }
        .current-price { font-size: 18px; font-weight: bold; color: #aaa; margin-bottom: 20px; min-height: 24px; }
        
        .mini-plate { position: relative; background: white; color: black; border: 2px solid black; border-radius: 4px; padding: 5px 10px; font-family: 'Arial Black', sans-serif; font-size: 18px; font-weight: bold; display: inline-block; margin: 10px 0; }
        .mini-plate .rarity-label { font-size: 9px; top: -10px; left: -5px; padding: 1px 5px; }

        /* Кнопки */
        .btn-container { margin: 20px 0; display: flex; flex-direction: column; gap: 15px; }
        .btn { background: #444; color: #eee; border: none; padding: 14px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; width: 100%; box-shadow: 0 3px 0 #222; transition: 0.1s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
        .btn-letters { background: #3a4a5a; box-shadow: 0 3px 0 #1a2a3a; }
        .btn-save { background: #5a4a3a; box-shadow: 0 3px 0 #3a2a1a; margin-top: 10px; }
        .btn-green { background: #3a5a3a; box-shadow: 0 3px 0 #1a3a1a; margin-top: 10px; }
        .btn-close { background: #6a3a3a; box-shadow: 0 3px 0 #3a1a1a; margin-top: 10px; }
        .btn-gold { background: #c5a000; box-shadow: 0 3px 0 #8a7000; color: #111; margin-top: 10px; font-weight: 900; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; transform: none; }
        
        /* Табы и списки */
        .inventory, .garage, .cases-container { background: #222; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; }
        .item { background: #333; padding: 12px; margin: 10px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; flex-wrap: wrap; gap: 10px; position: relative; }
        .item button { background: #6a3a3a; color: white; border: none; padding: 8px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; flex-grow: 1; font-weight: bold; }
        .item button.buy { background: #3a5a3a; }
        .item button.blue { background: #3a4a5a; }
        
        .nav-tabs { display: flex; justify-content: space-around; background: #252525; border-radius: 8px; padding: 5px; flex-wrap: wrap; gap: 5px; }
        .nav-tab { padding: 10px; cursor: pointer; font-size: 13px; border-radius: 6px; flex-grow: 1; text-align: center; transition: 0.3s; color: #999; font-weight: bold; }
        .nav-tab.active { background: #444; color: white; }
        .hidden { display: none !important; }

        /* Картинки авто */
        .car-img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; background: #444; }
        
        /* Дизайн кейсов */
        .case-box { background: linear-gradient(135deg, #444, #222); border: 2px solid #555; border-radius: 10px; padding: 20px; text-align: center; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .case-box:active { transform: scale(0.98); }
        .case-icon { font-size: 50px; margin-bottom: 10px; display: block; }
        .case-title { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: white; }
        .case-price { color: #66bb6a; font-size: 18px; font-weight: bold; }

        .roulette-container { padding: 20px; background: #111; border-radius: 8px; margin: 20px 0; overflow: hidden; border: 3px solid #444; }
    </style>
</head>
<body>

    <!-- Окно регистрации / смены профиля -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0; color: #66bb6a;" id="auth-title">Добро пожаловать</h3>
            <p style="font-size: 14px; margin-top: 0; color: #aaa;">Никнейм:</p>
            <input type="text" id="nickname-input" placeholder="Никнейм" maxlength="15">
            <p style="font-size: 14px; margin-top: 0; color: #aaa;">Аватар (необязательно):</p>
            <input type="file" id="avatar-input" accept="image/*">
            <button class="btn btn-green" onclick="saveProfile()" id="auth-btn">Сохранить</button>
            <button class="btn btn-close hidden" id="auth-close-btn" onclick="closeProfileModal()">Отмена</button>
        </div>
    </div>

    <!-- Настройки -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0;" id="t-settings">Настройки</h3>
            <label id="t-volume
